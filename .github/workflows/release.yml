name: build-tp-agent

# tp-agent(Talon Pilot 本地 edge 客户端)跨平台构建 + 发布。
#
# 源码来自私有主仓(地址 + token 走 secret:MAIN_REPO_HOST / XGIT_TOKEN)+ 两个公开仓:
# - talon-bin(github.com/darkmice/talon-bin):含 talon-sys;libtalon 由 build.rs 从其公开 release 下载。
# - talon-sandbox-sdk-rust(github.com/talon-org):main 的云端预览(cloud_preview)依赖它(path 依赖)。
# 两个公开仓都免 token。
#
# 触发:手动(workflow_dispatch)或推 tag(v*,会顺带发 Release)。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "talon-pilot 主仓的分支/tag(默认 main)"
        default: main
  push:
    tags: ["v*"]

env:
  # 公开依赖仓。主仓地址 + token 走 secret(MAIN_REPO_HOST / XGIT_TOKEN),不写死在公开仓里。
  TALON_BIN_REPO: https://github.com/darkmice/talon-bin.git
  TALON_SDK_REPO: https://github.com/talon-org/talon-sandbox-sdk-rust.git
  # release 版默认连的线上地址(build-time 注入;pilot-agent 用 option_env 读,
  # 本地 cargo build 无此 env 时仍默认 localhost)。
  TP_DEFAULT_API_BASE: https://agents.deeplan.ai
  TP_DEFAULT_WEB_BASE: https://agents.deeplan.ai

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux:在 glibc 2.35(22.04)上编 + glibc-2.38 shim,产物可跑 glibc ≥2.35 的发行版。
          - { os: ubuntu-22.04, target: linux-x64, rust_target: x86_64-unknown-linux-gnu, shim: true }
          - { os: macos-14, target: macos-arm64, rust_target: aarch64-apple-darwin, shim: false }
          # Intel mac:在 arm64 runner 上交叉编译 x86_64,避开稀缺/排不到的 macos-13 Intel runner。
          - { os: macos-14, target: macos-x64, rust_target: x86_64-apple-darwin, shim: false }
          - { os: windows-latest, target: windows-x64, rust_target: x86_64-pc-windows-msvc, shim: false }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout client repo (workflow + shim)
        uses: actions/checkout@v4

      - name: Clone sources (main repo + talon-bin) as siblings
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.ref || 'main' }}"
          mkdir -p build && cd build
          echo "::group::clone talon-pilot ($REF)"
          git clone --depth 1 --branch "$REF" \
            "https://oauth2:${{ secrets.XGIT_TOKEN }}@${{ secrets.MAIN_REPO_HOST }}" talon-pilot \
            || git clone --depth 1 "https://oauth2:${{ secrets.XGIT_TOKEN }}@${{ secrets.MAIN_REPO_HOST }}" talon-pilot
          echo "::endgroup::"
          echo "::group::clone talon-bin (engine, public)"
          git clone --depth 1 "${TALON_BIN_REPO}" talon-bin
          # 只留 talon-sys:删掉 talon-bundle* 避免 build.rs 误走"本地源码编引擎"
          # (那条要 superclaw-db 等未克隆的私有仓),强制走公开 release 下载 libtalon。
          rm -rf talon-bin/talon-bundle talon-bin/talon-bundle-evocore
          # 防御:上游 darkmice/talon-bin 的 talon-sys/build.rs L69 当前有一处 find-replace
          # 写崩的损坏(const TALON_LIB_VERSION: TALON_LIB_VERSION: ...),会让 talon-sys 编不过。
          # 仅在检测到损坏时临时修正;上游修好后此处自动跳过(no-op)。
          if grep -q 'TALON_LIB_VERSION: TALON_LIB_VERSION' talon-bin/talon-sys/build.rs; then
            echo "⚠️ talon-bin build.rs L69 上游损坏,临时修正为 const TALON_LIB_VERSION: &str = \"0.1.39\";"
            perl -i -pe 's{^(\s*)const TALON_LIB_VERSION:.*$}{$1const TALON_LIB_VERSION: &str = "0.1.39";}' talon-bin/talon-sys/build.rs
          fi
          echo "::endgroup::"
          echo "::group::clone talon-sandbox-sdk-rust (SDK, public; main 的 cloud_preview path 依赖)"
          git clone --depth 1 "${TALON_SDK_REPO}" talon-sandbox-sdk-rust
          echo "::endgroup::"

      - name: Rewrite hardcoded talon-sys path (absolute -> sibling)
        run: |
          set -euo pipefail
          cd build/talon-pilot
          perl -i -pe 's{path\s*=\s*"/Users/[^"]*/talon-bin/talon-sys"}{path = "../../../talon-bin/talon-sys"}' \
            crates/pilot-storage/Cargo.toml
          echo "talon-sys 依赖行:"; grep talon-sys crates/pilot-storage/Cargo.toml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: build/talon-pilot

      - name: Add rust target
        run: rustup target add ${{ matrix.rust_target }}

      # —— 链接期容错说明 ——
      # talon-sys 链入的预编译 libtalon.a(talon-bin release)是 Rust 静态库,
      # 内嵌它编译时那版 std 的 rust_eh_personality。它和 runner 当前 stable
      # toolchain 的 std 版本不一致时,会报 duplicate symbol: rust_eh_personality
      # (linux: rust-lld;windows: LNK2005/LNK1169)。两份是**同一函数同一实现**
      # (library/std/src/sys/personality/gcc.rs),取任一份语义等价 → 让链接器
      # 容忍重复定义即可。各平台链接器标志不同:
      #   linux/gcc+lld : -Wl,--allow-multiple-definition
      #   windows/MSVC  : /FORCE:MULTIPLE
      # (根治路径是让 talon-bin libtalon.a 与本仓 toolchain pin 到同版本,
      #  属后续治理;此处先解封发版。)
      - name: Build tp-agent + tp (Linux + glibc shim)
        if: matrix.shim
        run: |
          set -euo pipefail
          cc -c -fPIC -O2 "$GITHUB_WORKSPACE/scripts/glibc23-shim.c" -o /tmp/glibc23-shim.o
          cd build/talon-pilot
          for bin in tp-agent tp; do
            cargo rustc -p pilot-agent --release --target ${{ matrix.rust_target }} --bin "$bin" -- \
              -Clink-arg=/tmp/glibc23-shim.o \
              -Clink-arg=-Wl,--allow-multiple-definition
          done

      - name: Build tp-agent + tp (cross / native)
        if: ${{ !matrix.shim }}
        run: |
          set -euo pipefail
          cd build/talon-pilot
          # macOS 的 ld 不认 --allow-multiple-definition,也不需要(mach-o 容忍
          # 重复弱符号);只对 windows MSVC 加 /FORCE:MULTIPLE。
          if [ "${{ runner.os }}" = "Windows" ]; then
            for bin in tp-agent tp; do
              cargo rustc -p pilot-agent --release --target ${{ matrix.rust_target }} --bin "$bin" -- \
                -Clink-arg=/FORCE:MULTIPLE
            done
          else
            cargo build --release --target ${{ matrix.rust_target }} --bin tp-agent --bin tp
          fi

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          cd build/talon-pilot/target/${{ matrix.rust_target }}/release
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$GITHUB_WORKSPACE/dist/tp-agent-${{ matrix.target }}.zip" tp-agent.exe tp.exe
          else
            tar czf "$GITHUB_WORKSPACE/dist/tp-agent-${{ matrix.target }}.tar.gz" tp-agent tp
          fi
          ls -la "$GITHUB_WORKSPACE/dist"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tp-agent-${{ matrix.target }}
          path: dist/*

  # 浏览器扩展 ZIP(平台无关,单独一个 job 编一次)。用户「加载已解压的扩展程序」用;
  # .crx 现代 Chrome 不让站外直装,故只发 ZIP。作为 release 资产,得稳定下载链接
  # https://github.com/darkmice/talon-pilot-client/releases/latest/download/talon-browser-extension.zip
  build-extension:
    name: package browser extension
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Clone main repo (browser-extension 源)
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.ref || 'main' }}"
          git clone --depth 1 --branch "$REF" \
            "https://oauth2:${{ secrets.XGIT_TOKEN }}@${{ secrets.MAIN_REPO_HOST }}" talon-pilot \
            || git clone --depth 1 "https://oauth2:${{ secrets.XGIT_TOKEN }}@${{ secrets.MAIN_REPO_HOST }}" talon-pilot
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build + zip extension
        run: |
          set -euo pipefail
          cd talon-pilot/browser-extension
          npm ci || npm install
          npm run build
          STAGE=talon-browser-extension
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp -r manifest.json dist icons popup.html popup.css tokens.css "$STAGE/"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          ( cd "$STAGE/.." && zip -r "$GITHUB_WORKSPACE/dist/talon-browser-extension.zip" "$STAGE" )
          ls -la "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: talon-browser-extension
          path: dist/*

  release:
    name: publish release
    needs: [build, build-extension]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
